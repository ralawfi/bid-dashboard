<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upsource Bid Performance Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root[data-theme="light"]{ --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F6F7F8; --ink:#1D252D; --ink2:#8E9AA0; --line:#DDDFE2; --header:#4F008C; --track:#DDDFE2; --hover:#F6F7F8; }
  :root[data-theme="dark"]{ --bg:#1D252D; --panel:#232D36; --panel2:#1A222A; --ink:#FFFFFF; --ink2:#8E9AA0; --line:#35414C; --header:#3A1066; --track:#35414C; --hover:#2A343E; }
  * { box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Lucida Sans','Lucida Sans Unicode','Lucida Grande',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:#4F008C; text-decoration:none; }
  input, select, button{ font-family:inherit; }
  button{ cursor:pointer; }
  .btn{ padding:10px 18px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:13px; display:flex; align-items:center; gap:8px; border-radius:999px; box-shadow:0 1px 2px rgba(29,37,45,.05); }
  .btn:hover{ background:var(--hover); }
  .rowhover:hover{ background:var(--hover); }
  .clickable{ cursor:pointer; }
  table{ border-collapse:collapse; width:100%; }
  th, td{ padding:12px 14px; font-size:13px; text-align:left; white-space:nowrap; }
  th{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); cursor:pointer; border-bottom:1px solid var(--line); background:var(--panel2); }
  th:hover{ color:#4F008C; }
  tr.datarow{ border-bottom:1px solid var(--line); }
  input[type=text]{ border-radius:12px; }
  ::placeholder{ color:var(--ink2); }

  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
  .charts-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  @media (max-width:1080px){
    .grid-4{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:900px){
    .charts-2{ grid-template-columns:1fr; }
  }
  @media (max-width:560px){
    .grid-4{ grid-template-columns:1fr; }
  }
</style>
</head>

      const clean = raw.replace(/^\d+\s*-\s*/, '').trim() || 'Identified';

    const sell = at(r, 'type', 'selltype') || 'Not recorded';

  const o = opts || {};

    if (!o.ignorePeriod && !inPeriod(d, state.period)) return false;

function metrics(list){

  const open = list.filter(o => o.status === 'Open'), noBid = list.filter(o => o.status === 'Cancelled' || o.status === 'Dropped');

function loadText(t, label){

  const notes = [];
  if (noValue) notes.push(noValue + ' of ' + data.length + ' records have no contract value recorded — they count in bid volumes but not in value totals or average deal size.');
  if (res.unmapped.length) notes.push('Stage value' + (res.unmapped.length > 1 ? 's' : '') + ' outside the agreed mapping, classified by keyword: ' + res.unmapped.join(', ') + '.');
  if (!res.hasSubCol) notes.push('No Customer Submission Date column in this export — the submissions view groups weeks by close date instead.');

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k];
    if (v==null || v===false) continue;
    if (k==='style' && typeof v==='object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v==='function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k==='class') e.className = v;
    else e.setAttribute(k, v);
  }
  const append = c => {
    if (c==null || c===false) return;
    if (Array.isArray(c)) return c.forEach(append);
    if (typeof c==='string' || typeof c==='number') e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  };
  kids.forEach(append);
  return e;
}

  );
  content.appendChild(tableCard);
  content.appendChild(h('div', { style:{ marginTop:'20px', fontSize:'12px', color:'var(--ink2)', lineHeight:'1.7' } },
    'Reads CRM exports with Opportunity Owner, Account Name, Opportunity Name, Stage, Close Date, Created Date, Business Portfolio, Opportunity Type, Type, Business Type, Etimad Type, Opportunity Number and Total Contract Value (TCV). Stage prefixes 1\u20137 set the pipeline order; dates are read day-first. All periods cover 1 January to 31 December 2026 on the selected date basis.'));
}

function paintSubmissions(content, s, d){
  const w = weekWindows();
  const subScope = scoped({ ignorePeriod:true });
  const inWin = (o,win) => !!o.submitted && o.submitted>=win.from && o.submitted<=win.to;
  const sum = a => a.reduce((x,o)=>x+o.value,0);
  const subFilterCard = h('div', { style:{ border:'1px solid var(--line)', background:'var(--panel)', padding:'22px 24px', borderRadius:'20px', boxShadow:'0 1px 3px rgba(29,37,45,.06)', display:'flex', flexDirection:'column', gap:'20px', marginBottom:'12px' } });
  subFilterCard.appendChild(h('div', {}, filterLabel('Channel'),
    multiTabs(['Etimad','Non Etimad'], s.channels, arr => set({ channels:arr }))));
  { const pfScope = scoped({ ignorePortfolio:true, ignorePeriod:true }); const agg = {}; pfScope.forEach(o => agg[o.portfolio] = (agg[o.portfolio]||0)+1);
    const keys = Object.keys(agg).sort();
    subFilterCard.appendChild(h('div', {}, filterLabel('Portfolio'), multiChips(keys, agg, s.portfolios, arr => set({ portfolios:arr }), d)));
  }
  { const lineScope = scoped({ ignoreLines:true, ignorePeriod:true }); const agg = {}; lineScope.forEach(o => agg[o.line] = (agg[o.line]||0)+1);
    const keys = Object.keys(agg).sort((a,b) => agg[b]-agg[a]);
    subFilterCard.appendChild(h('div', {}, filterLabel('Service line'),
      h('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' } }, keys.map(k => { const on = s.lines.indexOf(k)>-1;
        return h('div', { class:'clickable', onclick:() => set({ lines: on ? s.lines.filter(x=>x!==k) : s.lines.concat([k]) }),
          style:{ display:'flex', alignItems:'center', gap:'8px', padding:'7px 14px', fontSize:'13px', borderRadius:'999px', border:'1px solid '+(on?P.purple:'var(--line)'), background: on ? (d?'rgba(79,0,140,.45)':'#F3ECF8') : 'var(--panel)', color: on ? (d?'#FFFFFF':P.purple) : 'var(--ink)' } },
          dot(lineColor(k)), k + ' (' + agg[k] + ')'); }))));
  }
  content.appendChild(subFilterCard);
  content.appendChild(h('div', { style:{ border:'1px solid var(--line)', background:'var(--panel2)', borderRadius:'16px', padding:'12px 20px', marginBottom:'20px', fontSize:'13px', color:'var(--ink2)' } },
    (s.hasSubCol?'Grouped by Customer Submission Date':'No Customer Submission Date column in this export — grouped by Close Date')+' \u00b7 weeks run Sunday to Saturday \u00b7 today is '+fmtDate(w.today)+' \u00b7 last week shows bids at Submitted \u2014 under evaluation, other weeks show bids at Qualified in progress'));

  const bucketDefs = [
    { key:'last', label:'Last week', win:w.last, mark:P.silver, range: fmtDate(w.last.from)+' \u2013 '+fmtDate(w.last.to), stage:'Submitted \u2014 under evaluation' },
    { key:'current', label:'Current week', win:w.current, mark:P.coral, range: fmtDate(w.current.from)+' \u2013 '+fmtDate(w.current.to), stage:'Qualified in progress' },
    { key:'next', label:'Next week', win:w.next, mark:P.sea, range: fmtDate(w.next.from)+' \u2013 '+fmtDate(w.next.to), stage:'Qualified in progress' },
    { key:'upcoming', label:'All upcoming', win:w.upcoming, mark:P.oasis, range: 'from '+fmtDate(w.upcoming.from), stage:'Qualified in progress' }
  ].map(b => { const list = subScope.filter(o => inWin(o,b.win) && o.stage===b.stage); return Object.assign({},b,{ list }); });

  content.appendChild(h('div', { class:'grid-4' },
    bucketDefs.map(b => { const on = s.bucket===b.key;
      return h('div', { class:'clickable', onclick:() => setState({ bucket:b.key }), style:{ background: on?P.purple:'var(--panel)', color: on?'#FFFFFF':'var(--ink)', border:'1px solid '+(on?P.purple:'var(--line)'), borderRadius:'16px', boxShadow:'0 1px 3px rgba(29,37,45,.06)', padding:'18px', display:'flex', flexDirection:'column', gap:'10px', minHeight:'140px' } },
        h('div', { style:{ display:'flex', alignItems:'center', gap:'8px' } }, dot(on?'#FFFFFF':b.mark), h('div', { style:{ fontSize:'11px', letterSpacing:'.1em', textTransform:'uppercase', opacity:.82 } }, b.label)),
        h('div', { style:{ fontSize:'30px', fontWeight:'300' } }, String(b.list.length)),
        h('div', { style:{ fontSize:'12px', opacity:.72 } }, sar(sum(b.list))),
        h('div', { style:{ marginTop:'auto', fontSize:'12px', opacity:.68 } }, b.range)); })
  ));

  const activeBucket = bucketDefs.filter(b=>b.key===s.bucket)[0] || bucketDefs[1];
  const sq = s.subQuery.trim().toLowerCase();
  const subDir = s.subSortDir==='asc'?1:-1;
  let subList = activeBucket.list.filter(o => !sq || (o.name+' '+o.num+' '+o.account+' '+o.owner).toLowerCase().indexOf(sq)>-1);
  subList = subList.slice().sort((a,b) => { let x=a[s.subSortKey], y=b[s.subSortKey];
    if (x==null) x = typeof y==='number' ? -1 : ''; if (y==null) y = typeof x==='number' ? -1 : '';
    return (typeof x==='number' && typeof y==='number' ? x-y : String(x).localeCompare(String(y))) * subDir; });

  content.appendChild(h('div', { style:{ border:'1px solid var(--line)', background:'var(--panel)', borderRadius:'20px', boxShadow:'0 1px 3px rgba(29,37,45,.06)', overflow:'hidden' } },
    h('div', { style:{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:'16px', flexWrap:'wrap', padding:'20px 20px 14px' } },
      h('div', {}, h('div', { style:{ fontSize:'16px', fontWeight:'700' } }, activeBucket.label+' \u00b7 '+activeBucket.range),
        h('div', { style:{ fontSize:'12px', color:'var(--ink2)', marginTop:'4px' } }, subList.length+' submissions \u00b7 '+sar(sum(subList))+' contract value \u00b7 click a column to sort, a row for bid detail')),
      h('input', { type:'text', value:s.subQuery, placeholder:'Search opportunity, account or owner', style:{ padding:'9px 14px', border:'1px solid var(--line)', background:'var(--panel2)', color:'var(--ink)', fontSize:'13px', width:'300px', maxWidth:'100%' }, oninput:e => setState({ subQuery:e.target.value }) })
    ),
    h('div', { style:{ overflowX:'auto' } },
      h('table', {},
        h('thead', {}, h('tr', {}, SUB_COLS.map(c => h('th', { onclick:() => setState({ subSortKey:c.key, subSortDir: s.subSortKey===c.key ? (s.subSortDir==='asc'?'desc':'asc') : (c.key==='value'?'desc':'asc') }),
          style:{ color: s.subSortKey===c.key ? P.purple : 'var(--ink2)', textAlign:c.align } }, c.label+(s.subSortKey===c.key ? (s.subSortDir==='asc'?' \u25b2':' \u25bc') : ''))))),
        h('tbody', {}, subList.length ? subList.map(o => h('tr', { class:'datarow rowhover clickable', onclick:() => setState({ detailId:o.id }) },
            h('td', {}, fmtDate(o.submitted)), h('td', {}, o.name), h('td', {}, o.account), h('td', {}, o.line),
            h('td', {}, o.stage), h('td', { style:{ textAlign:'right' } }, o.value?short(o.value):'—'), h('td', {}, o.owner)))
          : [h('tr', {}, h('td', { colspan:7, style:{ textAlign:'center', padding:'40px', color:'var(--ink2)' } }, 'No submissions in this window for the current filters.'))])
      )
    )
  ));
}

function paintDetail(root, s, d, stageStyle){
  if (!s.detailId) return;
  const o = s.data.filter(x => x.id===s.detailId)[0];
  if (!o) return;
  const facts = [
    ['Outcome', o.status], ['Owner', o.owner], ['Service line', o.line], ['Opportunity type', o.reqType],
    ['Etimad type', o.channel==='Unspecified'?'Not recorded':o.channel], ['Business portfolio', o.portfolio],
    ['Created', fmtDate(o.created)], ['Submission', fmtDate(o.submitted)]
  ];
  const close = () => setState({ detailId:null });
  const overlay = h('div', { style:{ position:'fixed', inset:'0', zIndex:'40', display:'flex', justifyContent:'flex-end' } },
    h('div', { onclick:close, style:{ position:'absolute', inset:'0', background:'rgba(29,37,45,.5)' } }),
    h('div', { style:{ position:'relative', width:'min(480px,100%)', background:'var(--bg)', height:'100%', overflowY:'auto', borderRadius:'24px 0 0 24px', boxShadow:'-4px 0 16px rgba(29,37,45,.12)' } },
      h('div', { style:{ background:P.purple, color:'#FFFFFF', padding:'22px 24px', borderRadius:'24px 0 0 0', display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:'16px' } },
        h('div', {},
          h('div', { style:{ fontSize:'11px', letterSpacing:'.12em', textTransform:'uppercase', opacity:.82, marginBottom:'10px' } }, o.num+' \u00b7 '+o.sell),
          h('div', { style:{ fontSize:'20px', fontWeight:'300', lineHeight:'1.3' } }, o.name),
          h('div', { style:{ fontSize:'13px', opacity:.8, marginTop:'6px' } }, o.account)
        ),
        h('div', { class:'clickable', onclick:close, style:{ fontSize:'14px', width:'28px', height:'28px', borderRadius:'50%', background:'rgba(255,255,255,.18)', display:'flex', alignItems:'center', justifyContent:'center' } }, '\u2715')
      ),
      h('div', { style:{ padding:'20px 24px', display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:'16px' } },
        h('div', {}, h('div', { style:{ fontSize:'11px', letterSpacing:'.12em', textTransform:'uppercase', color:'var(--ink2)', marginBottom:'8px' } }, 'Total contract value'), h('div', { style:{ fontSize:'30px', fontWeight:'300' } }, o.value?sar(o.value):'Not recorded')),
        h('div', { style:{ textAlign:'right' } }, h('div', { style:{ fontSize:'11px', letterSpacing:'.12em', textTransform:'uppercase', color:'var(--ink2)', marginBottom:'8px' } }, 'Stage'), h('div', { style:{ fontSize:'14px' } }, o.stage))
      ),
      h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(2,minmax(0,1fr))', gap:'8px', padding:'0 24px 20px' } },
        facts.map(f => h('div', { style:{ padding:'14px 16px', background:'var(--panel2)', borderRadius:'12px' } },
          h('div', { style:{ fontSize:'11px', letterSpacing:'.1em', textTransform:'uppercase', color:'var(--ink2)', marginBottom:'6px' } }, f[0]),
          h('div', { style:{ fontSize:'14px' } }, f[1])))
      ),
      h('div', { style:{ padding:'0 24px 24px' } },
        h('div', { style:{ fontSize:'11px', letterSpacing:'.12em', textTransform:'uppercase', color:'var(--ink2)', marginBottom:'12px' } }, 'Bid timeline'),
        h('div', {},
          h('div', { style:{ padding:'6px 0', fontSize:'13px' } }, '\u2022 Opportunity created \u2014 ' + o.portfolio + ' portfolio \u00b7 ' + o.reqType + ' \u00b7 ' + fmtDate(o.created)),
          h('div', { style:{ padding:'6px 0', fontSize:'13px' } }, '\u2022 ' + (o.status==='Open' ? 'Current stage: '+o.stage : 'Outcome: '+o.status)),
          h('div', { style:{ padding:'6px 0', fontSize:'13px' } }, '\u2022 Close date \u2014 ' + (o.value?sar(o.value)+' contract value':'No contract value recorded') + ' \u00b7 ' + fmtDate(o.closing))
        )
      )
    )
  );
  root.appendChild(overlay);
}

/* ---------------- init ---------------- */
loadBaseline();
render();
})();
</script>
</body>
</html>
